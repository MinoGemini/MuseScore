<!doctype html>
<!--
  Test page for the web API (muapi.js).
  Opens a score on startup (?score=test/<file>, default test/score.mscz) and
  offers export and playback controls. #audio-peak shows the loudest output
  sample seen so far, so playback can be checked without listening.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MuseScore web test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #screen { width: 100%; height: calc(100% - 28px); }
    #bar { height: 28px; display: flex; gap: 6px; align-items: center; padding: 0 6px; font: 12px sans-serif; }
    #export-result { display: none; }
  </style>
</head>
<body data-state="loading">
  <div id="bar">
    <button id="export-musicxml">Export MusicXML</button>
    <button id="export-mxl">Export MXL</button>
    <span id="export-status"></span>
    <button id="play">Play</button>
    <button id="stop">Stop</button>
    <span>audio: <span id="audio-state">none</span>, peak <span id="audio-peak">0</span></span>
  </div>
  <div id="screen"></div>
  <pre id="export-result"></pre>
  <script>
    // Meter the app's audio output: insert an analyser in front of the
    // destination of whichever node the audio driver connects to it.
    (() => {
      const connect = AudioNode.prototype.connect;
      let peak = 0;
      AudioNode.prototype.connect = function(destination, ...rest) {
        if (destination instanceof AudioDestinationNode && !this.__metered) {
          this.__metered = true;
          const analyser = this.context.createAnalyser();
          analyser.fftSize = 2048;
          connect.call(this, analyser);
          const samples = new Float32Array(analyser.fftSize);
          setInterval(() => {
            analyser.getFloatTimeDomainData(samples);
            for (const s of samples) peak = Math.max(peak, Math.abs(s));
            const peakEl = document.querySelector("#audio-peak");
            peakEl.textContent = peak.toFixed(4);
            peakEl.dataset.state = peak > 0.001 ? "sound" : "silent";
            document.querySelector("#audio-state").textContent = this.context.state;
          }, 100);
        }
        return connect.call(this, destination, ...rest);
      };
    })();
  </script>
  <script type="module">
    import createMuApi from "./distr/muapi.js";
    const params = new URLSearchParams(location.search);
    const scoreUrl = params.get("score") || "test/score.mscz";
    const scoreName = scoreUrl.split("/").pop();

    async function runExport(format) {
      const status = document.querySelector("#export-status");
      const result = document.querySelector("#export-result");
      try {
        const bytes = await window.muapi.exportScore(format);
        const head = format === "mxl"
          ? Array.from(bytes.slice(0, 4)).map(b => b.toString(16).padStart(2, "0")).join(" ")
          : new TextDecoder().decode(bytes);
        result.textContent = head;
        status.textContent = `${format}: ${bytes.length} bytes`;
        result.dataset.state = "done";
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([bytes]));
        a.download = `export.${format}`;
        status.appendChild(a);
      } catch (e) {
        status.textContent = `${format}: ${e.message}`;
        result.dataset.state = "failed";
      }
    }
    document.querySelector("#export-musicxml").onclick = () => runExport("musicxml");
    document.querySelector("#export-mxl").onclick = () => runExport("mxl");
    document.querySelector("#play").onclick = () => window.muapi.dispatch("play");
    document.querySelector("#stop").onclick = () => window.muapi.dispatch("stop");

    window.muapi = await createMuApi({
      screen: document.querySelector("#screen"),
      preload: ["sound/preload.json"],
      onLoaded: async () => {
        document.body.dataset.state = "app-ready";
        setTimeout(async () => {
          const data = new Uint8Array(await (await fetch(scoreUrl)).arrayBuffer());
          window.muapi.loadScoreData(data, scoreName);
          document.body.dataset.state = "score-requested";
        }, 1500);
      },
      onExit: (e) => { document.body.dataset.state = "exited:" + e.code; },
    });
  </script>
  <script src="MuseScoreStudio.js"></script>
</body>
</html>
